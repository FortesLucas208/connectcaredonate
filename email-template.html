<!--
  ConnectCare — Template de E-mail
  Como usar:
   - Substitua {{NOME}} pelo nome do destinatário
   - Substitua {{MENSAGEM}} pelo conteúdo do e-mail (pode conter <br> ou <p>)
   - Substitua {{LINK_SITE}} pela URL do site (padrão: https://connectcaredonate.lovable.app)
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>ConnectCare</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f3247;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f7fb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px -10px rgba(70,150,200,0.25);">
          
          <!-- Header com gradiente da marca -->
          <tr>
            <td style="background:linear-gradient(135deg,#7ec5e6 0%,#92d5b3 100%);padding:40px 32px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:28px;font-weight:700;letter-spacing:-0.5px;">
                ConnectCare
              </h1>
              <p style="margin:8px 0 0;color:#ffffff;opacity:0.95;font-size:14px;">
                Conectando corações através da doação
              </p>
            </td>
          </tr>

          <!-- Corpo do e-mail -->
          <tr>
            <td style="padding:40px 32px 24px;">
              <h2 style="margin:0 0 16px;color:#1f3247;font-size:22px;font-weight:600;">
                Olá, {{NOME}}!
              </h2>
              <div style="color:#4a6278;font-size:16px;line-height:1.6;">
                {{MENSAGEM}}
              </div>
            </td>
          </tr>

          <!-- Botão CTA -->
          <tr>
            <td style="padding:8px 32px 40px;text-align:center;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                <tr>
                  <td style="background:linear-gradient(135deg,#7ec5e6 0%,#92d5b3 100%);border-radius:12px;">
                    <a href="{{LINK_SITE}}"
                       style="display:inline-block;padding:14px 36px;color:#ffffff;font-size:16px;font-weight:600;text-decoration:none;border-radius:12px;">
                      Acessar o site
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divisor -->
          <tr>
            <td style="padding:0 32px;">
              <div style="border-top:1px solid #e4eef5;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px 32px;text-align:center;">
              <p style="margin:0;color:#7d92a6;font-size:13px;line-height:1.5;">
                Você está recebendo este e-mail porque interagiu com a ConnectCare.<br/>
                © 2026 ConnectCare — Todos os direitos reservados.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
